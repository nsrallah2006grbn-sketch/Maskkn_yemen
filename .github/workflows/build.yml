name: Build Maskani Yemen Pro APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create or Update pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: maskani_app
          description: "مسكني اليمن Pro"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            url_launcher: ^6.2.5
            http: ^1.2.0
            device_info_plus: ^10.1.0
            android_id: ^0.3.6
            shared_preferences: ^2.2.2

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

      - name: Prepare Flutter Project Structure
        run: |
          if [ ! -d "android" ]; then
            flutter create . --org com.maskani.yemen --project-name maskani_app --platforms android
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maskani-pro-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
