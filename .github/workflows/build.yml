name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Flutter Project Structure
        run: |
          flutter create . --org com.maskani.yemen --project-name maskani_app --platforms android
          mkdir -p lib
          # تأكد أن ملف الـ main.dart في مكانه الصحيح
          if [ -f "main.dart" ]; then mv main.dart lib/main.dart; fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maskani-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
